[build]
target = "riscv32imc-esp-espidf"
#target = "riscv32imac-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# With picolibc (the default since ESP-IDF v6.0), add "--cfg", "espidf_picolibc" as well
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# The workspace is virtual, so name the crate whose `[package.metadata.esp-idf-sys]` applies
ESP_IDF_SYS_ROOT_CRATE = "esp-idf-examples"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
ESP_IDF_VERSION = "v5.5.5"
#MCU = "esp32h2"
#MCU = "esp32h21"
# The esp32s31 shares the riscv32imafc target with the esp32p4
#MCU = "esp32s31"
#ESP_IDF_VERSION = "v6.1"
# The esp32h4 shares the riscv32imafc target with the esp32p4
#MCU = "esp32h4"

[alias]
# Workspace maintenance tasks (see `xtask/src/main.rs`), built for the host
xtask = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "host-tuple", "--config", "unstable.build-std=[]", "--"]
