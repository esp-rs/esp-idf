name: PublishDryRun (esp-idf-svc)

on: workflow_dispatch

env:
  # Newer nightlies cannot build `std` for ESP-IDF, as libc 0.2.191 renamed the `stat` fields
  # it reads (rust-lang/rust#164555)
  rust_toolchain: nightly-2026-10-19

jobs:
  publishdryrun:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v3

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src
      - name: Build | Publish Dry Run
        run: export ESP_IDF_TOOLS_INSTALL_DIR=out; cargo publish -p esp-idf-svc --dry-run --target riscv32imc-esp-espidf -Zbuild-std=std,panic_abort
